[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rcil"
version = "1.1.0"
authors = [
  { name="Saifullah Shafin" },
]
description = "Recursive Contextual Intelligence Loop (RCIL) & Universal Question Intelligence Layer for Autonomous AI Agents"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = []

[project.scripts]
rcil = "rcil.cli:main"
