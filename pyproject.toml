[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rcil"
version = "1.1.0"
authors = [
  { name="Saifullah Shafin" },
]
description = "RCIL: The Question Intelligence Layer for System One (TypeSafe Jev). Cuts autonomous agent costs by 95% and eliminates decision hallucinations."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
keywords = [
    "system-one",
    "typesafe-jev",
    "rcil",
    "agentic-ai",
    "decision-intelligence",
    "ai-agents",
    "cost-optimization",
    "openrouter"
]
dependencies = []

[project.scripts]
rcil = "rcil.cli:main"
